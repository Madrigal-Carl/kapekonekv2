<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>KapeKonek — Navbar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.kk-nav a:focus-visible,.kk-nav button:focus-visible{outline:2px solid #7B4A2A;outline-offset:2px}
.kk-navlink:hover{color:#7B4A2A !important}
.kk-iconbtn:hover{background:#F7EFE4 !important}
.kk-menuitem:hover{background:#F7EFE4 !important}
@media (max-width:720px){.kk-nav-hide-sm{display:none !important}}
@media (min-width:721px){.kk-nav-show-sm{display:none !important}}
</style>
</helmet>
<header class="kk-nav" style="width: 100%; height: 64px; background: rgba(255,255,255,0.94); border-bottom: 1px solid #E7DCCD; font-family: 'Poppins', ui-sans-serif, system-ui, sans-serif; color: #2B1A12; box-sizing: border-box">
  <div style="max-width: 1280px; height: 64px; margin: 0 auto; padding: 0 32px; display: flex; align-items: center; justify-content: space-between; gap: 16px">
    <div style="display: flex; align-items: center; gap: 40px">
      <a href="Main.dc.html" aria-label="KapeKonek home" style="display: flex; align-items: center; gap: 10px; text-decoration: none; color: #2B1A12">
        <span style="width: 34px; height: 34px; display: grid; place-items: center; border-radius: 8px; background: #2B1A12; color: #EBC98F">
          <svg aria-hidden="true" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="12" rx="6.5" ry="9" transform="rotate(35 12 12)"></ellipse><path d="M8.8 5.6c3 3 .4 6.4 3.4 8.9s2.1 3.4 3.4 3.9"></path></svg>
        </span>
        <span style="font-size: 16px; font-weight: 600; letter-spacing: -0.01em; line-height: 1.1">KapeKonek</span>
      </a>
      <nav aria-label="Main" class="kk-nav-hide-sm" style="display: flex; align-items: center; gap: 28px">
        <a class="kk-navlink" href="Products.dc.html" aria-current="{{ productsCurrent }}" style="position: relative; font-size: 13.5px; text-decoration: none; color: {{ productsColor }}; font-weight: {{ productsWeight }}; padding: 22px 0">Products
          <sc-if value="{{ isProducts }}" hint-placeholder-val="{{ false }}"><span style="position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: #7B4A2A"></span></sc-if>
        </a>
        <a class="kk-navlink" href="Main.dc.html#how" style="font-size: 13.5px; text-decoration: none; color: #4A3A30; padding: 22px 0">How it works</a>
      </nav>
    </div>

    <div style="display: flex; align-items: center; gap: 6px">
      <a class="kk-iconbtn" href="{{ cartHref }}" aria-label="Cart, {{ cartCount }} items" style="position: relative; width: 44px; height: 44px; display: grid; place-items: center; border-radius: 5px; color: #4A3A30; text-decoration: none">
        <svg aria-hidden="true" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"></path><path d="M3 6h18"></path><path d="M16 10a4 4 0 0 1-8 0"></path></svg>
        <sc-if value="{{ hasCart }}" hint-placeholder-val="{{ false }}">
          <span style="position: absolute; right: 4px; top: 4px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 999px; background: #7B4A2A; color: #FFFFFF; font-size: 10.5px; font-weight: 600; line-height: 18px; text-align: center">{{ cartCount }}</span>
        </sc-if>
      </a>

      <sc-if value="{{ isGuest }}" hint-placeholder-val="{{ true }}">
        <a class="kk-navlink kk-nav-hide-sm" href="Login.dc.html" style="padding: 10px 12px; font-size: 13.5px; text-decoration: none; color: #4A3A30">Log in</a>
        <a href="Register.dc.html" style="display: inline-flex; align-items: center; gap: 6px; background: #7B4A2A; color: #FFFFFF; text-decoration: none; padding: 9px 14px; border-radius: 5px; font-size: 13.5px; font-weight: 500; min-height: 40px">Get started
          <svg aria-hidden="true" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"></path><path d="m12 5 7 7-7 7"></path></svg>
        </a>
      </sc-if>

      <sc-if value="{{ isBuyer }}" hint-placeholder-val="{{ false }}">
        <button class="kk-iconbtn" type="button" aria-label="Notifications, 3 unread" style="position: relative; width: 44px; height: 44px; display: grid; place-items: center; border: 0; border-radius: 5px; background: transparent; color: #4A3A30; cursor: pointer">
          <svg aria-hidden="true" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"></path></svg>
          <span style="position: absolute; right: 5px; top: 5px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 999px; background: #B3261E; color: #FFFFFF; font-size: 10.5px; font-weight: 600; line-height: 18px; text-align: center">3</span>
        </button>
        <div style="position: relative; margin-left: 4px">
          <button type="button" onClick="{{ toggleMenu }}" aria-haspopup="menu" aria-expanded="{{ menuOpen }}" aria-label="Account menu for Juana Dela Cruz" style="display: flex; align-items: center; gap: 6px; padding: 4px 6px 4px 4px; border-radius: 999px; border: 1px solid #E7DCCD; background: #FFFFFF; color: #4A3A30; cursor: pointer; min-height: 42px">
            <span style="width: 32px; height: 32px; display: grid; place-items: center; border-radius: 999px; background: #7B4A2A; color: #FFFFFF; font-size: 12px; font-weight: 600">JD</span>
            <svg aria-hidden="true" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="transform: {{ chevron }}"><path d="m6 9 6 6 6-6"></path></svg>
          </button>
          <sc-if value="{{ menuOpen }}" hint-placeholder-val="{{ false }}">
            <div role="menu" aria-label="Account" style="position: absolute; right: 0; top: calc(100% + 8px); z-index: 50; width: 240px; background: #FFFFFF; border: 1px solid #E7DCCD; border-radius: 8px; box-shadow: 0 18px 40px -20px rgba(43,26,18,0.45); padding: 6px">
              <div style="padding: 10px 12px 12px; border-bottom: 1px solid #EFE6DA; margin-bottom: 6px">
                <span style="display: block; font-size: 14px; font-weight: 600; color: #2B1A12">Juana Dela Cruz</span>
                <span style="display: block; font-size: 12px; color: #6B5A4E">@juanadc</span>
              </div>
              <a class="kk-menuitem" role="menuitem" href="Profile.dc.html" style="display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 5px; color: #2B1A12; font-size: 14px; text-decoration: none"><svg aria-hidden="true" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="#7B4A2A" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg>Profile</a>
              <a class="kk-menuitem" role="menuitem" href="Orders.dc.html" style="display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 5px; color: #2B1A12; font-size: 14px; text-decoration: none"><svg aria-hidden="true" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="#7B4A2A" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="m7.5 4.27 9 5.15"></path><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"></path><path d="m3.3 7 8.7 5 8.7-5"></path><path d="M12 22V12"></path></svg>Orders</a>
              <a class="kk-menuitem" role="menuitem" href="Addresses.dc.html" style="display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 5px; color: #2B1A12; font-size: 14px; text-decoration: none"><svg aria-hidden="true" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="#7B4A2A" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"></path><circle cx="12" cy="10" r="3"></circle></svg>Addresses</a>
              <a class="kk-menuitem" role="menuitem" href="Settings.dc.html" style="display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 5px; color: #2B1A12; font-size: 14px; text-decoration: none"><svg aria-hidden="true" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="#7B4A2A" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>Settings</a>
              <div style="height: 1px; background: #EFE6DA; margin: 6px 4px"></div>
              <a class="kk-menuitem" role="menuitem" href="Modals.dc.html" style="display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 5px; color: #9B2C24; font-size: 14px; text-decoration: none"><svg aria-hidden="true" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" x2="9" y1="12" y2="12"></line></svg>Log out</a>
            </div>
          </sc-if>
        </div>
      </sc-if>

      <button class="kk-iconbtn kk-nav-show-sm" type="button" aria-label="Open menu" style="width: 44px; height: 44px; display: grid; place-items: center; border: 1px solid #E7DCCD; border-radius: 5px; background: #FFFFFF; color: #2B1A12; cursor: pointer">
        <svg aria-hidden="true" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16"></path><path d="M4 12h16"></path><path d="M4 18h16"></path></svg>
      </button>
    </div>
  </div>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"variant":{"editor":"enum","options":["guest","buyer"],"default":"guest"},"active":{"editor":"enum","options":["home","products","none"],"default":"home"},"cartCount":{"editor":"int","default":0,"min":0,"max":99},"$preview":{"width":1440,"height":64}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { menuOpen: false }; }
  renderVals() {
    const variant = this.props.variant ?? 'guest';
    const active = this.props.active ?? 'home';
    const isGuest = variant === 'guest';
    const cartCount = isGuest ? 0 : (this.props.cartCount ?? 2);
    const isProducts = active === 'products';
    const menuOpen = this.state.menuOpen;
    return {
      menuOpen,
      chevron: menuOpen ? 'rotate(180deg)' : 'none',
      toggleMenu: () => this.setState({ menuOpen: !menuOpen }),
      isGuest,
      isBuyer: !isGuest,
      cartCount,
      hasCart: cartCount > 0,
      cartHref: isGuest ? 'Login.dc.html' : 'CartDrawer.dc.html',
      isProducts,
      productsCurrent: isProducts ? 'page' : 'false',
      productsColor: isProducts ? '#7B4A2A' : '#4A3A30',
      productsWeight: isProducts ? '600' : '400'
    };
  }
}
</script>
</body>
</html>
