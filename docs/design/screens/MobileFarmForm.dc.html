<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>KapeKonek — Phone — add farm drawer</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Poppins',ui-sans-serif,system-ui,sans-serif;color:#2B1A12;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
a{color:#7B4A2A}a:hover{color:#653B20}
.kk-f:focus{outline:none;border-color:#7B4A2A !important;box-shadow:0 0 0 3px rgba(123,74,42,.18)}
button:focus-visible,a:focus-visible,label:focus-within{outline:2px solid #7B4A2A;outline-offset:2px}
.kk-menu{display:none !important}
@media (max-width: 960px){.kk-side{display:none !important}.kk-menu{display:grid !important}.kk-hide-sm{display:none !important}.kk-main{padding:20px 16px 40px !important}}
.kk-dt-cards{display:none}
@media (max-width: 720px){
.kk-dt-bar{flex-direction:column !important;align-items:stretch !important;padding:12px !important}
.kk-dt-search{max-width:none !important;flex:1 1 auto !important}
.kk-dt-filters{display:grid !important;grid-template-columns:repeat(2,minmax(0,1fr)) !important;gap:8px !important}
.kk-dt-filters > div{width:auto !important}
.kk-dt-clear{grid-column:1 / -1;justify-self:start}
.kk-dt-table{display:none !important}
.kk-dt-cards{display:flex !important}
.kk-dt-foot{flex-direction:column !important;align-items:stretch !important;text-align:center}
.kk-dt-foot nav{justify-content:center}
.kk-g2,.kk-g3{grid-template-columns:minmax(0,1fr) !important}
.kk-ph-actions{width:100%}
.kk-ph-actions > *{flex:1 1 auto}
.kk-seg{width:100%}
.kk-seg > button{flex:1 1 0}
.kk-drawer{width:100% !important;border-left:0 !important}
.kk-drawer-body{padding:20px 18px 28px !important}
.kk-drawer-head,.kk-drawer-foot{padding-left:18px !important;padding-right:18px !important}
.kk-drawer-foot > *{flex:1 1 auto}
}
</style>
</helmet>
<div style="width: 390px; min-height: 1900px; overflow: hidden"><dc-import name="Farms" role="group_manager" start="add" hint-size="100%,1900px"></dc-import></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview": {"width": 390, "height": 1900}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
