<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>KapeKonek — Map (Marinduque)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div role="application" aria-label="{{ ariaLabel }}" onClick="{{ mapClick }}" style="position: relative; width: 100%; aspect-ratio: {{ ratio }}; border-radius: {{ radius }}; border: 1px solid #E7DCCD; background: #DCE7EA; overflow: hidden; cursor: {{ cursor }}; font-family: 'Poppins', ui-sans-serif, system-ui, sans-serif; color: #2B1A12; box-sizing: border-box">
  <div style="position: absolute; inset: 0; transform-origin: 0 0; transform: translate({{ tx }}, {{ ty }}) scale({{ z }}); transition: transform .75s cubic-bezier(.22,.7,.2,1)">
    <svg aria-hidden="true" viewBox="0 0 600 440" preserveAspectRatio="xMidYMid slice" fill="none" style="position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible">
      <rect x="-600" y="-440" width="1800" height="1320" fill="#DCE7EA"></rect>
      <path d="M542.6 -22.0L542.6 89.3L536.7 86.9L531.6 77.0L521.3 64.6L477.7 64.6L477.7 54.7L464.8 49.7L441.7 48.5L431.4 42.3L428.9 36.1L426.3 23.7L421.2 16.3L416.0 10.1L396.4 -22.0Z" fill="#E8DFCF" stroke="#BFAF95" stroke-width="1.2" vector-effect="non-scaling-stroke"></path>
      <path d="M364.7 193.4L367.2 199.6L380.1 208.2L385.2 215.7L377.5 236.7L336.4 280.1L321.0 301.1L328.7 316.0L321.0 329.6L297.9 348.2L287.6 350.6L277.3 342.0L267.1 332.1L259.3 325.9L251.6 322.2L228.5 301.1L220.8 298.6L210.5 298.6L202.8 296.2L197.7 290.0L184.9 271.4L161.8 247.9L159.2 240.4L161.8 223.1L161.8 218.1L159.2 207.0L159.2 168.6L161.8 157.5L166.9 151.3L187.4 116.6L187.4 109.2L190.0 89.4L192.6 84.4L202.8 81.9L213.1 91.8L228.5 115.4L231.1 110.4L238.8 104.2L243.9 99.3L254.2 110.4L269.6 114.1L285.0 109.2L290.2 94.3L300.4 100.5L308.1 107.9L310.7 115.4L305.6 125.3L315.9 121.6L326.1 125.3L328.7 132.7L321.0 140.1L323.6 142.6L331.3 147.6L336.4 150.0L346.7 142.6L362.1 146.3L374.9 157.5L380.1 169.8L377.5 173.6L372.4 174.8L364.7 174.8L364.7 181.0L364.7 193.4Z" fill="#EFE6D6" stroke="#B49C7B" stroke-width="1.5" stroke-linejoin="round" vector-effect="non-scaling-stroke"></path>
      <sc-if value="{{ showArea }}" hint-placeholder-val="{{ false }}">
        <circle cx="{{ area.cx }}" cy="{{ area.cy }}" r="{{ area.r }}" fill="rgba(200,145,58,0.16)" stroke="#C8913A" stroke-width="1.5" stroke-dasharray="5 4" vector-effect="non-scaling-stroke"></circle>
      </sc-if>
      <sc-for list="{{ towns }}" as="t" hint-placeholder-count="6">
        <circle cx="{{ t.x }}" cy="{{ t.y }}" r="{{ t.r }}" fill="#8C7A66"></circle>
        <text x="{{ t.lx }}" y="{{ t.ly }}" fill="#7A6A5E" font-size="{{ t.fs }}" font-family="Poppins, sans-serif">{{ t.name }}</text>
      </sc-for>
      <rect x="{{ kal.x }}" y="{{ kal.y }}" width="{{ kal.s }}" height="{{ kal.s }}" rx="{{ kal.rx }}" fill="#2B1A12"></rect>
    </svg>
    <sc-for list="{{ pinList }}" as="pn" hint-placeholder-count="4">
      <button type="button" aria-label="{{ pn.aria }}" aria-pressed="{{ pn.on }}" onClick="{{ pn.pick }}" style="position: absolute; left: {{ pn.left }}; top: {{ pn.top }}; transform-origin: 50% 100%; transform: translate(-50%, -100%) scale({{ pn.scale }}); width: 30px; height: 36px; padding: 0; border: 0; background: transparent; cursor: pointer; transition: transform .75s cubic-bezier(.22,.7,.2,1)">
        <svg aria-hidden="true" viewBox="0 0 24 28" width="30" height="36"><path d="M12 27s9-8.2 9-15a9 9 0 0 0-18 0c0 6.8 9 15 9 15Z" fill="{{ pn.fill }}" stroke="{{ pn.ring }}" stroke-width="{{ pn.ringW }}"></path><circle cx="12" cy="12" r="3.6" fill="#FFFFFF"></circle></svg>
      </button>
    </sc-for>
    <span style="position: absolute; left: 54%; top: 35.5%; transform-origin: 0 0; transform: scale({{ inv }}) translate(-50%, 8px); font-size: 10.5px; font-weight: 600; color: #2B1A12; background: rgba(255,255,255,0.9); padding: 1px 6px; border-radius: 4px; white-space: nowrap; pointer-events: none; transition: transform .75s cubic-bezier(.22,.7,.2,1)">Kaluppa</span>
  </div>

  <sc-if value="{{ hasPop }}" hint-placeholder-val="{{ false }}">
    <div role="dialog" aria-label="{{ pop.title }}" onClick="{{ stop }}" style="position: absolute; left: {{ pop.left }}; top: {{ pop.top }}; transform: translate(-50%, calc(-100% - 46px)); width: 264px; background: #FFFFFF; border: 1px solid #E7DCCD; border-radius: 8px; box-shadow: 0 18px 40px -18px rgba(43,26,18,0.5); padding: 14px; cursor: default; z-index: 5">
      <div style="display: flex; justify-content: space-between; gap: 8px; align-items: flex-start">
        <div style="min-width: 0"><span style="display: block; font-size: 11px; color: #6B5A4E; font-family: ui-monospace, Menlo, monospace">{{ pop.code }}</span><span style="display: block; font-size: 14.5px; font-weight: 600; line-height: 1.3">{{ pop.title }}</span></div>
        <button type="button" aria-label="Close" onClick="{{ closePop }}" style="width: 30px; height: 30px; flex-shrink: 0; border: 0; background: transparent; color: #6B5A4E; display: grid; place-items: center; cursor: pointer; border-radius: 4px"><svg aria-hidden="true" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"></path></svg></button>
      </div>
      <dl style="margin: 10px 0 0; display: grid; grid-template-columns: auto 1fr; gap: 5px 12px; font-size: 12.5px">
        <sc-for list="{{ pop.rows }}" as="pr" hint-placeholder-count="5"><dt style="color: #6B5A4E">{{ pr.k }}</dt><dd style="margin: 0; font-weight: 500">{{ pr.v }}</dd></sc-for>
      </dl>
      <a href="{{ pop.href }}" style="margin-top: 12px; display: flex; justify-content: center; align-items: center; min-height: 36px; border: 1px solid #DCCBB5; border-radius: 5px; color: #2B1A12; font-size: 13px; font-weight: 600; text-decoration: none">Open farm</a>
    </div>
  </sc-if>

  <sc-if value="{{ controls }}" hint-placeholder-val="{{ true }}">
    <div onClick="{{ stop }}" style="position: absolute; right: 12px; top: 12px; display: flex; flex-direction: column; background: #FFFFFF; border: 1px solid #DCCBB5; border-radius: 6px; overflow: hidden; box-shadow: 0 4px 12px -6px rgba(43,26,18,0.35)">
      <button type="button" aria-label="Zoom in" onClick="{{ zoomIn }}" style="width: 36px; height: 36px; border: 0; border-bottom: 1px solid #EFE6DA; background: #FFFFFF; color: #2B1A12; display: grid; place-items: center; cursor: pointer"><svg aria-hidden="true" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14M12 5v14"></path></svg></button>
      <button type="button" aria-label="Zoom out" onClick="{{ zoomOut }}" style="width: 36px; height: 36px; border: 0; border-bottom: 1px solid #EFE6DA; background: #FFFFFF; color: #2B1A12; display: grid; place-items: center; cursor: pointer"><svg aria-hidden="true" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14"></path></svg></button>
      <button type="button" aria-label="Show all of Marinduque" onClick="{{ zoomAll }}" style="width: 36px; height: 36px; border: 0; background: #FFFFFF; color: #7B4A2A; display: grid; place-items: center; cursor: pointer"><svg aria-hidden="true" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3M21 8V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3M16 21h3a2 2 0 0 0 2-2v-3"></path></svg></button>
    </div>
  </sc-if>
  <sc-if value="{{ hasNote }}" hint-placeholder-val="{{ false }}">
    <span style="position: absolute; left: 12px; bottom: 12px; font-size: 11px; color: #4A3A30; background: rgba(255,255,255,0.92); padding: 3px 8px; border-radius: 4px">{{ note }}</span>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"pins":{"editor":null},"focus":{"editor":null},"selectedId":{"editor":null},"onPin":{"editor":null},"onMapClick":{"editor":null},"area":{"editor":null},"note":{"editor":null},"controls":{"editor":"boolean","default":true},"ratio":{"editor":null},"$preview":{"width":600,"height":440}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    const f = props.focus || { cx: 300, cy: 220, z: 1 };
    this.state = { view: f, fkey: JSON.stringify(props.focus || null), sel: props.selectedId ?? null, skey: props.selectedId ?? null };
  }
  componentDidUpdate() {
    const k = JSON.stringify(this.props.focus || null);
    if (k !== this.state.fkey) this.setState({ fkey: k, view: this.props.focus || { cx: 300, cy: 220, z: 1 } });
    const s = this.props.selectedId ?? null;
    if (s !== this.state.skey) this.setState({ skey: s, sel: s });
  }
  renderVals() {
    const p = this.props;
    const DOTS = { Boac: [179.4, 171.1, -29, 19], Mogpog: [194.4, 150.9, -26, -11], 'Santa Cruz': [314.4, 148.3, -22, -10], Torrijos: [351, 264.9, -11, 19], Buenavista: [251.4, 310.2, -29, 20], Gasan: [183, 260.5, -15, 20] };
    const clamp = (cx, cy, z) => { z = Math.max(1, Math.min(6, z)); const hw = 300 / z, hh = 220 / z; return { cx: Math.max(hw, Math.min(600 - hw, cx)), cy: Math.max(hh, Math.min(440 - hh, cy)), z }; };
    const v = clamp(this.state.view.cx, this.state.view.cy, this.state.view.z);
    const z = v.z, inv = 1 / z, Tx = 300 - z * v.cx, Ty = 220 - z * v.cy;
    const pins = p.pins || [
      { id: 'a', x: 300, y: 160, label: 'Farm A', tone: 'farmer' }, { id: 'b', x: 212, y: 165, label: 'Farm B', tone: 'farmer' }, { id: 'c', x: 330, y: 250, label: 'Kaluppa farm', tone: 'kaluppa' }
    ];
    const sel = this.state.sel;
    const sp = pins.find((x) => x.id === sel && x.pop);
    const pct = (x, y) => [((z * x + Tx) / 600 * 100).toFixed(2) + '%', ((z * y + Ty) / 440 * 100).toFixed(2) + '%'];
    const fly = (cx, cy, zz) => this.setState({ view: clamp(cx, cy, zz) });
    const TONES = { farmer: '#7B4A2A', kaluppa: '#2B1A12', gm: '#8A5A12', new: '#C8913A' };
    return {
      ariaLabel: p.ariaLabel || 'Map of Marinduque',
      ratio: p.ratio || '600 / 440',
      radius: p.flush ? '0' : '8px',
      cursor: p.onMapClick ? 'crosshair' : 'grab',
      tx: (Tx / 600 * 100).toFixed(3) + '%', ty: (Ty / 440 * 100).toFixed(3) + '%', z: z.toFixed(3), inv: inv.toFixed(4),
      towns: Object.keys(DOTS).map((t) => { const [x, y, dx, dy] = DOTS[t]; return { name: t, x, y, r: 3 * inv, lx: x + dx * inv, ly: y + dy * inv, fs: (10.5 * inv).toFixed(3) }; }),
      kal: { x: 324 - 5 * inv, y: 156 - 5 * inv, s: 10 * inv, rx: 2 * inv },
      showArea: !!p.area, area: p.area || { cx: 0, cy: 0, r: 0 },
      pinList: pins.map((x) => { const on = x.id === sel; return { left: (x.x / 600 * 100).toFixed(3) + '%', top: (x.y / 440 * 100).toFixed(3) + '%', scale: (inv * (on ? 1.15 : 1)).toFixed(4), fill: TONES[x.tone] || TONES.farmer, ring: on ? '#C8913A' : '#FFFFFF', ringW: on ? 2.4 : 1.5, on, aria: x.label, pick: (e) => { e.stopPropagation(); this.setState({ sel: x.id }); if (p.onPin) p.onPin(x.id); } }; }),
      hasPop: !!sp,
      pop: sp ? { ...sp.pop, left: pct(sp.x, sp.y)[0], top: pct(sp.x, sp.y)[1] } : { title: '', code: '', rows: [], href: '#', left: '0%', top: '0%' },
      closePop: (e) => { e.stopPropagation(); this.setState({ sel: null }); },
      stop: (e) => e.stopPropagation(),
      mapClick: (e) => { if (!p.onMapClick) { if (sel) this.setState({ sel: null }); return; } const r = e.currentTarget.getBoundingClientRect(); const sx = (e.clientX - r.left) / r.width * 600, sy = (e.clientY - r.top) / r.height * 440; p.onMapClick((sx - Tx) / z, (sy - Ty) / z); },
      controls: p.controls ?? true,
      zoomIn: (e) => { e.stopPropagation(); fly(v.cx, v.cy, z * 1.6); },
      zoomOut: (e) => { e.stopPropagation(); fly(v.cx, v.cy, z / 1.6); },
      zoomAll: (e) => { e.stopPropagation(); fly(300, 220, 1); },
      hasNote: !!p.note, note: p.note || ''
    };
  }
}
</script>
</body>
</html>
