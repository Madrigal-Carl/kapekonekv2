<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>KapeKonek — Add address</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Poppins',ui-sans-serif,system-ui,sans-serif;color:#2B1A12;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
a{color:#7B4A2A}a:hover{color:#653B20}
.kk-f:focus{outline:none;border-color:#7B4A2A !important;box-shadow:0 0 0 3px rgba(123,74,42,.18)}
button:focus-visible,a:focus-visible,label:focus-within{outline:2px solid #7B4A2A;outline-offset:2px}
</style>
</helmet>
<div style="width: 1440px; height: 1000px; background: rgba(43,26,18,0.5); display: flex; align-items: center; justify-content: center; padding: 40px">
  <div role="dialog" aria-modal="true" aria-labelledby="addr-title" style="width: 1080px; max-width: 100%; background: #FFFFFF; border: 1px solid #E7DCCD; border-radius: 8px; box-shadow: 0 24px 48px -24px rgba(43,26,18,0.5); display: flex; flex-direction: column">
    <div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; padding: 18px 24px; border-bottom: 1px solid #EFE6DA">
      <div>
        <span style="display: block; font-size: 10.5px; letter-spacing: 0.16em; text-transform: uppercase; color: #6B5A4E; font-weight: 500">Delivery address</span>
        <h2 id="addr-title" style="margin: 2px 0 0; font-size: 19px; font-weight: 600">Add new address</h2>
      </div>
      <a href="Addresses.dc.html" aria-label="Close" style="width: 40px; height: 40px; display: grid; place-items: center; border-radius: 5px; color: #6B5A4E"><svg aria-hidden="true" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg></a>
    </div>

    <div style="display: flex; flex-wrap: wrap; gap: 24px; padding: 20px 24px">
      <!-- MAP -->
      <div style="flex: 1 1 460px; min-width: 0; display: flex; flex-direction: column; gap: 10px">
        <div style="display: flex; gap: 8px">
          <div style="position: relative; flex: 1">
            <svg aria-hidden="true" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#7A6A5E" stroke-width="2" stroke-linecap="round" style="position: absolute; left: 12px; top: 50%; transform: translateY(-50%)"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path></svg>
            <label for="q" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Search a place</label>
            <input class="kk-f" id="q" placeholder="Search a place, street or landmark" style="width: 100%; border: 1px solid #DCCBB5; border-radius: 5px; padding: 10px 12px 10px 36px; font: inherit; font-size: 13.5px">
          </div>
          <button type="button" onClick="{{ useMine }}" style="display: inline-flex; align-items: center; gap: 6px; border: 1px solid #DCCBB5; background: #FFFFFF; color: #2B1A12; padding: 0 12px; border-radius: 5px; font: inherit; font-size: 13px; font-weight: 500; cursor: pointer; min-height: 42px; white-space: nowrap">
            <svg aria-hidden="true" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="#7B4A2A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M12 2v3M12 19v3M2 12h3M19 12h3"></path><circle cx="12" cy="12" r="8"></circle></svg>Use my location
          </button>
        </div>
        <div role="application" aria-label="Map. Click to drop your delivery pin." onClick="{{ dropPin }}" style="position: relative; aspect-ratio: 600 / 440; border-radius: 8px; border: 1px solid #E7DCCD; background: #DCE7EA; overflow: hidden; cursor: crosshair">
          <div style="position: absolute; inset: 0; transform-origin: 0 0; transform: translate({{ tx }}, {{ ty }}) scale({{ z }}); transition: transform .75s cubic-bezier(.22,.7,.2,1)">
            <svg aria-hidden="true" viewBox="0 0 600 440" fill="none" style="position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible">
              <rect x="-600" y="-440" width="1800" height="1320" fill="#DCE7EA"></rect>
              <path d="M542.6 -22.0L542.6 89.3L536.7 86.9L531.6 77.0L521.3 64.6L477.7 64.6L477.7 54.7L464.8 49.7L441.7 48.5L431.4 42.3L428.9 36.1L426.3 23.7L421.2 16.3L416.0 10.1L396.4 -22.0Z" fill="#E8DFCF" stroke="#BFAF95" stroke-width="1.2" vector-effect="non-scaling-stroke"></path>
              <path d="M364.7 193.4L367.2 199.6L380.1 208.2L385.2 215.7L377.5 236.7L336.4 280.1L321.0 301.1L328.7 316.0L321.0 329.6L297.9 348.2L287.6 350.6L277.3 342.0L267.1 332.1L259.3 325.9L251.6 322.2L228.5 301.1L220.8 298.6L210.5 298.6L202.8 296.2L197.7 290.0L184.9 271.4L161.8 247.9L159.2 240.4L161.8 223.1L161.8 218.1L159.2 207.0L159.2 168.6L161.8 157.5L166.9 151.3L187.4 116.6L187.4 109.2L190.0 89.4L192.6 84.4L202.8 81.9L213.1 91.8L228.5 115.4L231.1 110.4L238.8 104.2L243.9 99.3L254.2 110.4L269.6 114.1L285.0 109.2L290.2 94.3L300.4 100.5L308.1 107.9L310.7 115.4L305.6 125.3L315.9 121.6L326.1 125.3L328.7 132.7L321.0 140.1L323.6 142.6L331.3 147.6L336.4 150.0L346.7 142.6L362.1 146.3L374.9 157.5L380.1 169.8L377.5 173.6L372.4 174.8L364.7 174.8L364.7 181.0L364.7 193.4Z" fill="#EFE6D6" stroke="#B49C7B" stroke-width="1.5" stroke-linejoin="round" vector-effect="non-scaling-stroke"></path>
              <sc-if value="{{ hasMuni }}" hint-placeholder-val="{{ false }}">
                <path d="{{ muniD }}" fill="rgba(200,145,58,0.16)" stroke="#C8913A" stroke-width="2.2" stroke-linejoin="round" vector-effect="non-scaling-stroke"></path>
              </sc-if>
              <sc-if value="{{ showArea }}" hint-placeholder-val="{{ false }}">
                <path d="{{ brgyD }}" fill="rgba(123,74,42,0.24)" stroke="#7B4A2A" stroke-width="2" stroke-linejoin="round" vector-effect="non-scaling-stroke"></path>
              </sc-if>
              <sc-for list="{{ towns }}" as="t" hint-placeholder-count="6">
                <circle cx="{{ t.x }}" cy="{{ t.y }}" r="{{ t.r }}" fill="{{ t.dot }}"></circle>
                <text x="{{ t.lx }}" y="{{ t.ly }}" fill="{{ t.fg }}" font-size="{{ t.fs }}" font-weight="{{ t.fw }}" font-family="Poppins, sans-serif">{{ t.name }}</text>
              </sc-for>
              <rect x="{{ kal.x }}" y="{{ kal.y }}" width="{{ kal.s }}" height="{{ kal.s }}" rx="{{ kal.rx }}" fill="#2B1A12"></rect>
            </svg>
            <span style="position: absolute; left: 54%; top: 35.5%; transform-origin: 0 0; transform: scale({{ inv }}) translate(-50%, 8px); font-size: 10.5px; font-weight: 600; color: #2B1A12; background: rgba(255,255,255,0.9); padding: 1px 6px; border-radius: 4px; white-space: nowrap; pointer-events: none; transition: transform .75s cubic-bezier(.22,.7,.2,1)">Kaluppa</span>
            <sc-if value="{{ hasPin }}" hint-placeholder-val="{{ true }}">
              <div style="position: absolute; left: {{ pinLeft }}; top: {{ pinTop }}; transform-origin: 50% 100%; transform: translate(-50%, -100%) scale({{ inv }}); pointer-events: none; display: flex; flex-direction: column; align-items: center; transition: transform .75s cubic-bezier(.22,.7,.2,1), left .45s ease, top .45s ease">
                <span style="background: #2B1A12; color: #FFFFFF; font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 4px; white-space: nowrap; margin-bottom: 2px">Deliver here</span>
                <svg aria-hidden="true" viewBox="0 0 24 24" width="34" height="34" fill="#7B4A2A" stroke="#FFFFFF" stroke-width="1.5"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"></path><circle cx="12" cy="10" r="3" fill="#FFFFFF"></circle></svg>
              </div>
            </sc-if>
          </div>

          <div style="position: absolute; right: 12px; top: 12px; display: flex; flex-direction: column; background: #FFFFFF; border: 1px solid #DCCBB5; border-radius: 6px; overflow: hidden; box-shadow: 0 4px 12px -6px rgba(43,26,18,0.35)">
            <button type="button" aria-label="Zoom in" onClick="{{ zoomIn }}" style="width: 36px; height: 36px; border: 0; border-bottom: 1px solid #EFE6DA; background: #FFFFFF; color: #2B1A12; display: grid; place-items: center; cursor: pointer"><svg aria-hidden="true" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14"></path><path d="M12 5v14"></path></svg></button>
            <button type="button" aria-label="Zoom out" onClick="{{ zoomOut }}" style="width: 36px; height: 36px; border: 0; border-bottom: 1px solid #EFE6DA; background: #FFFFFF; color: #2B1A12; display: grid; place-items: center; cursor: pointer"><svg aria-hidden="true" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14"></path></svg></button>
            <button type="button" aria-label="Show all of Marinduque" onClick="{{ zoomAll }}" style="width: 36px; height: 36px; border: 0; background: #FFFFFF; color: #7B4A2A; display: grid; place-items: center; cursor: pointer"><svg aria-hidden="true" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3"></path><path d="M21 8V5a2 2 0 0 0-2-2h-3"></path><path d="M3 16v3a2 2 0 0 0 2 2h3"></path><path d="M16 21h3a2 2 0 0 0 2-2v-3"></path></svg></button>
          </div>
          <sc-if value="{{ outside }}" hint-placeholder-val="{{ false }}">
            <div role="alert" style="position: absolute; left: 12px; right: 60px; top: 12px; font-size: 12.5px; color: #7A2A22; background: #FDF0EE; border: 1px solid #F2C9C4; border-radius: 6px; padding: 8px 10px">That spot is outside our delivery area. We deliver anywhere in Marinduque.</div>
          </sc-if>
          <span style="position: absolute; left: 12px; bottom: 12px; font-size: 11px; color: #4A3A30; background: rgba(255,255,255,0.92); padding: 3px 8px; border-radius: 4px">{{ zoomLabel }}</span>
        </div>
        <p aria-live="polite" style="margin: 0; display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: #4A3A30">
          <svg aria-hidden="true" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="#7B4A2A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"></path><circle cx="12" cy="10" r="3"></circle></svg>
          {{ pinNote }}
        </p>
      </div>

      <!-- FORM -->
      <form style="position: relative; flex: 1 1 380px; min-width: 0; display: flex; flex-direction: column; gap: 14px">
        <fieldset style="border: 0; margin: 0; padding: 0">
          <legend style="font-size: 10.5px; letter-spacing: 0.16em; text-transform: uppercase; color: #4A3A30; font-weight: 500; padding: 0">Label</legend>
          <div style="margin-top: 8px; display: flex; gap: 8px">
            <sc-for list="{{ labels }}" as="l" hint-placeholder-count="3">
              <button type="button" aria-pressed="{{ l.on }}" onClick="{{ l.pick }}" style="min-height: 38px; padding: 7px 14px; border-radius: 999px; border: 1px solid {{ l.border }}; background: {{ l.bg }}; color: {{ l.fg }}; font: inherit; font-size: 13px; font-weight: 500; cursor: pointer">{{ l.name }}</button>
            </sc-for>
          </div>
        </fieldset>
        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
          <div>
            <label for="rn" style="display: block; font-size: 10.5px; letter-spacing: 0.16em; text-transform: uppercase; color: #4A3A30; font-weight: 500">Recipient name</label>
            <input class="kk-f" id="rn" defaultValue="Juana Dela Cruz" style="margin-top: 6px; width: 100%; border: 1px solid #DCCBB5; border-radius: 5px; padding: 10px 12px; font: inherit; font-size: 14px">
          </div>
          <div>
            <label for="rp" style="display: block; font-size: 10.5px; letter-spacing: 0.16em; text-transform: uppercase; color: #4A3A30; font-weight: 500">Phone</label>
            <input class="kk-f" id="rp" inputmode="tel" defaultValue="0917 123 4567" style="margin-top: 6px; width: 100%; border: 1px solid #DCCBB5; border-radius: 5px; padding: 10px 12px; font: inherit; font-size: 14px">
          </div>
          <div>
            <label for="pv" style="display: block; font-size: 10.5px; letter-spacing: 0.16em; text-transform: uppercase; color: #4A3A30; font-weight: 500">Province</label>
            <input id="pv" value="Marinduque" readOnly="{{ true }}" style="margin-top: 6px; width: 100%; border: 1px solid #EFE6DA; background: #FBF8F4; color: #4A3A30; border-radius: 5px; padding: 10px 12px; font: inherit; font-size: 14px">
          </div>
          <div style="position: relative; z-index: 3">
            <dc-import name="SearchSelect" label="Municipality" icon="pin" placeholder="Select municipality" search-placeholder="Search municipality" options="{{ munis }}" value="{{ muni }}" on-pick="{{ onMuni }}" hint-size="100%,70px"></dc-import>
          </div>
          <div style="position: relative; z-index: 2">
            <dc-import name="SearchSelect" label="Barangay" icon="home" placeholder="{{ brgyPlaceholder }}" search-placeholder="Search barangay" options="{{ brgys }}" value="{{ brgy }}" on-pick="{{ onBrgy }}" disabled="{{ noMuni }}" hint-size="100%,70px"></dc-import>
          </div>
          <div>
            <label for="pc" style="display: block; font-size: 10.5px; letter-spacing: 0.16em; text-transform: uppercase; color: #4A3A30; font-weight: 500">Postal code</label>
            <input class="kk-f" id="pc" value="{{ postal }}" placeholder="Fills in from municipality" readOnly="{{ true }}" style="margin-top: 6px; width: 100%; border: 1px solid #EFE6DA; background: #FBF8F4; color: #4A3A30; border-radius: 5px; padding: 10px 12px; font: inherit; font-size: 14px">
          </div>
        </div>
        <div>
          <label for="st" style="display: block; font-size: 10.5px; letter-spacing: 0.16em; text-transform: uppercase; color: #4A3A30; font-weight: 500">Street, house no., landmark</label>
          <input class="kk-f" id="st" value="{{ street }}" onInput="{{ onStreet }}" placeholder="e.g. Lot 12, Purok 3, near the chapel" style="margin-top: 6px; width: 100%; border: 1px solid #DCCBB5; border-radius: 5px; padding: 10px 12px; font: inherit; font-size: 14px">
        </div>
        <label style="display: flex; align-items: center; gap: 10px; font-size: 14px; cursor: pointer">
          <input type="checkbox" style="width: 18px; height: 18px; accent-color: #7B4A2A">Set as default address
        </label>
        <div style="display: flex; gap: 10px; align-items: flex-start; font-size: 13px; color: #4A3A30; background: #F7EFE4; border-radius: 6px; padding: 12px 14px">
          <svg aria-hidden="true" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#7B4A2A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0; margin-top: 2px"><path d="M10 17h4V5H2v12h3"></path><path d="M20 17h2v-3.34a4 4 0 0 0-1.17-2.83L19 9h-5"></path><circle cx="7.5" cy="17.5" r="2.5"></circle><circle cx="17.5" cy="17.5" r="2.5"></circle></svg>
          <span>{{ feeLead }}<strong>{{ km }}</strong>{{ feeMid }}<strong>{{ fee }}</strong>{{ feeTail }}</span>
        </div>
      </form>
    </div>

    <div style="display: flex; justify-content: flex-end; gap: 10px; padding: 16px 24px; border-top: 1px solid #EFE6DA; background: #FBF8F4; border-radius: 0 0 8px 8px">
      <a href="Addresses.dc.html" style="display: inline-flex; align-items: center; border: 1px solid #DCCBB5; background: #FFFFFF; color: #2B1A12; padding: 10px 16px; border-radius: 5px; font-size: 14px; font-weight: 500; text-decoration: none; min-height: 44px">Cancel</a>
      <a href="Addresses.dc.html" style="display: inline-flex; align-items: center; background: #7B4A2A; color: #FFFFFF; padding: 10px 18px; border-radius: 5px; font-size: 14px; font-weight: 600; text-decoration: none; min-height: 44px">Save address</a>
    </div>
  </div>
</div>
</x-dc>
