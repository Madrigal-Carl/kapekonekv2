<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>KapeKonek — Dashboard top bar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<header ref="{{ setRoot }}" style="position: relative; z-index: 30; height: 64px; display: flex; align-items: center; gap: 12px; padding: 0 24px; background: #FFFFFF; border-bottom: 1px solid #E7DCCD; font-family: 'Poppins', ui-sans-serif, system-ui, sans-serif; color: #2B1A12; box-sizing: border-box">
  <button type="button" class="kk-menu" aria-label="Open navigation" style="width: 40px; height: 40px; border: 1px solid #E7DCCD; background: #FFFFFF; border-radius: 5px; color: #2B1A12; place-items: center; cursor: pointer">
    <svg aria-hidden="true" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"></path></svg>
  </button>
  <nav aria-label="Breadcrumb" style="flex: 1; min-width: 0; font-size: 13px; color: #6B5A4E; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{ crumbA }} <span aria-hidden="true" style="margin: 0 6px">/</span> <span style="color: #2B1A12; font-weight: 500">{{ crumbB }}</span></nav>

  <sc-if value="{{ isFarmer }}" hint-placeholder-val="{{ false }}">
    <a href="Products.dc.html" style="display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 0 12px; border: 1px solid #DCCBB5; border-radius: 5px; color: #2B1A12; font-size: 13px; font-weight: 500; text-decoration: none">
      <svg aria-hidden="true" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#7B4A2A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4ZM3 6h18M16 10a4 4 0 0 1-8 0"></path></svg>Cart · 2
    </a>
  </sc-if>
  <button type="button" aria-label="Notifications, 3 unread" style="position: relative; width: 44px; height: 44px; display: grid; place-items: center; border: 0; background: transparent; color: #4A3A30; border-radius: 5px; cursor: pointer">
    <svg aria-hidden="true" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10.3 21a1.94 1.94 0 0 0 3.4 0"></path></svg>
    <span aria-hidden="true" style="position: absolute; top: 7px; right: 7px; min-width: 17px; height: 17px; padding: 0 4px; border-radius: 999px; background: #7B4A2A; color: #FFFFFF; font-size: 10px; font-weight: 600; display: grid; place-items: center; border: 2px solid #FFFFFF">3</span>
  </button>
  <div style="position: relative">
    <button type="button" aria-haspopup="menu" aria-expanded="{{ open }}" onClick="{{ toggle }}" style="display: flex; align-items: center; gap: 10px; border: 0; background: transparent; padding: 4px 6px 4px 4px; border-radius: 999px; font: inherit; color: #2B1A12; cursor: pointer; min-height: 44px">
      <span style="width: 34px; height: 34px; display: grid; place-items: center; border-radius: 999px; background: {{ avatarBg }}; color: #FFFFFF; font-size: 12px; font-weight: 600">{{ initials }}</span>
      <span class="kk-hide-sm" style="display: flex; flex-direction: column; align-items: flex-start; line-height: 1.2"><span style="font-size: 13px; font-weight: 600">{{ name }}</span><span style="font-size: 11.5px; color: #6B5A4E">{{ roleLabel }}</span></span>
      <svg aria-hidden="true" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="#6B5A4E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"></path></svg>
    </button>
    <sc-if value="{{ open }}" hint-placeholder-val="{{ false }}">
      <div role="menu" style="position: absolute; right: 0; top: calc(100% + 8px); width: 240px; background: #FFFFFF; border: 1px solid #E7DCCD; border-radius: 8px; box-shadow: 0 18px 40px -18px rgba(43,26,18,0.45); padding: 6px">
        <div style="padding: 10px 12px; border-bottom: 1px solid #EFE6DA; margin-bottom: 4px"><span style="display: block; font-size: 13.5px; font-weight: 600">{{ name }}</span><span style="display: block; font-size: 12px; color: #6B5A4E">@{{ username }}</span></div>
        <sc-for list="{{ menu }}" as="m" hint-placeholder-count="4">
          <a role="menuitem" href="{{ m.href }}" style="display: flex; align-items: center; min-height: 40px; padding: 8px 12px; border-radius: 5px; color: {{ m.fg }}; font-size: 13.5px; text-decoration: none">{{ m.label }}</a>
        </sc-for>
      </div>
    </sc-if>
  </div>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"role":{"editor":"enum","options":["farmer","group_manager","kaluppa"],"default":"farmer"},"crumbA":{"editor":"text","default":"Dashboard"},"crumbB":{"editor":"text","default":"Overview"},"$preview":{"width":1184,"height":64}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { open: false }; this.onDoc = (e) => { if (this.state.open && this.root && !this.root.contains(e.target)) this.setState({ open: false }); }; }
  componentDidMount() { document.addEventListener('mousedown', this.onDoc); }
  componentWillUnmount() { document.removeEventListener('mousedown', this.onDoc); }
  renderVals() {
    const role = this.props.role ?? 'farmer';
    const P = {
      farmer: { name: 'Rodel Mendoza', username: 'rodel.mendoza', initials: 'RM', bg: '#3F6B4E', label: 'Farmer' },
      group_manager: { name: 'Liza Ramos', username: 'liza.ramos', initials: 'LR', bg: '#8A5A12', label: 'Group Manager' },
      kaluppa: { name: 'Ana Villanueva', username: 'kaluppa', initials: 'AV', bg: '#2B1A12', label: 'Kaluppa' }
    }[role];
    const menu = [{ label: 'Profile', href: 'Profile.dc.html' }, { label: 'Account settings', href: role === 'farmer' ? 'FarmerAssociation.dc.html' : 'Settings.dc.html' }];
    if (role === 'farmer') menu.push({ label: 'Addresses', href: 'FarmerAddresses.dc.html' }, { label: 'Storefront', href: 'Products.dc.html' });
    menu.push({ label: 'Log out', href: 'Modals.dc.html', fg: '#A1362B' });
    return {
      setRoot: (el) => { this.root = el; },
      crumbA: this.props.crumbA ?? 'Dashboard', crumbB: this.props.crumbB ?? 'Overview',
      isFarmer: role === 'farmer',
      open: this.state.open, toggle: () => this.setState({ open: !this.state.open }),
      name: P.name, username: P.username, initials: P.initials, avatarBg: P.bg, roleLabel: P.label,
      menu: menu.map((m) => ({ ...m, fg: m.fg || '#2B1A12' }))
    };
  }
}
</script>
</body>
</html>
