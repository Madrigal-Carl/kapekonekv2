<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>KapeKonek — Dashboard sidebar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<aside aria-label="Dashboard navigation" style="width: 256px; min-height: 900px; height: 100%; background: #FFFFFF; border-right: 1px solid #E7DCCD; padding: 18px 12px 16px; display: flex; flex-direction: column; gap: 18px; font-family: 'Poppins', ui-sans-serif, system-ui, sans-serif; color: #2B1A12; box-sizing: border-box">
  <a href="{{ homeHref }}" style="display: flex; align-items: center; gap: 10px; padding: 2px 8px; text-decoration: none; color: #2B1A12">
    <span style="width: 34px; height: 34px; display: grid; place-items: center; border-radius: 8px; background: #2B1A12; color: #EBC98F"><svg aria-hidden="true" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="12" rx="6.5" ry="9" transform="rotate(35 12 12)"></ellipse><path d="M8.8 5.6c3 3 .4 6.4 3.4 8.9s2.1 3.4 3.4 3.9"></path></svg></span>
    <span style="display: flex; flex-direction: column; line-height: 1.15"><span style="font-size: 16px; font-weight: 600">KapeKonek</span><span style="font-size: 11px; color: #6B5A4E">{{ roleLabel }} dashboard</span></span>
  </a>

  <nav style="display: flex; flex-direction: column; gap: 14px">
    <sc-for list="{{ sections }}" as="sec" hint-placeholder-count="5">
      <div>
        <span style="display: block; padding: 0 12px 4px; font-size: 10.5px; letter-spacing: 0.16em; text-transform: uppercase; color: #6B5A4E; font-weight: 500">{{ sec.label }}</span>
        <ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 1px">
          <sc-for list="{{ sec.items }}" as="it" hint-placeholder-count="3">
            <li>
              <a href="{{ it.href }}" aria-current="{{ it.current }}" style="display: flex; align-items: center; gap: 10px; min-height: 40px; padding: 8px 12px; border-radius: 5px; background: {{ it.bg }}; color: {{ it.fg }}; font-size: 14px; font-weight: {{ it.fw }}; text-decoration: none">
                <svg aria-hidden="true" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="{{ it.icon }}"></path></svg>
                <span style="flex: 1">{{ it.label }}</span>
                <sc-if value="{{ it.hasBadge }}" hint-placeholder-val="{{ false }}">
                  <span style="min-width: 22px; height: 20px; padding: 0 6px; display: inline-grid; place-items: center; border-radius: 999px; background: {{ it.badgeBg }}; color: {{ it.badgeFg }}; font-size: 11px; font-weight: 600">{{ it.badge }}</span>
                </sc-if>
                <sc-if value="{{ it.external }}" hint-placeholder-val="{{ false }}">
                  <svg aria-hidden="true" viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="opacity: .7"><path d="M7 17 17 7M7 7h10v10"></path></svg>
                </sc-if>
              </a>
            </li>
          </sc-for>
        </ul>
      </div>
    </sc-for>
  </nav>

  <sc-if value="{{ hasOrg }}" hint-placeholder-val="{{ true }}">
    <div style="margin-top: auto; padding: 12px; border-radius: 8px; background: #F7EFE4; display: flex; gap: 10px; align-items: flex-start">
      <span aria-hidden="true" style="width: 30px; height: 30px; flex-shrink: 0; display: grid; place-items: center; border-radius: 6px; background: #FFFFFF; color: #7B4A2A"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18M5 21V7l7-4 7 4v14M9 21v-6h6v6"></path></svg></span>
      <span style="min-width: 0; display: flex; flex-direction: column"><span style="font-size: 11px; color: #6B5A4E">{{ orgCaption }}</span><span style="font-size: 13px; font-weight: 600; line-height: 1.3">{{ orgName }}</span><span style="margin-top: 4px; font-size: 11.5px; color: {{ orgStatusFg }}; font-weight: 600">{{ orgStatus }}</span></span>
    </div>
  </sc-if>
</aside>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"role":{"editor":"enum","options":["farmer","group_manager","kaluppa"],"default":"farmer"},"active":{"editor":"text","default":"Overview"},"farmerStatus":{"editor":"enum","options":["approved","pending","none"],"default":"approved"},"$preview":{"width":256,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const I = {
      overview: 'M3 3h7v9H3zM14 3h7v5h-7zM14 12h7v9h-7zM3 16h7v5H3z',
      farm: 'M7 20h10M10 20c5.5-2.5.8-6.4 3-10M9.5 9.4c1.1.8 1.8 2.2 2.3 3.7-2 .4-3.5.4-4.8-.3-1.2-.6-2.3-1.9-3-4.2 2.8-.5 4.4 0 5.5.8zM14.1 6a7 7 0 0 0-1.1 4c1.9-.1 3.3-.6 4.3-1.4 1-1 1.6-2.3 1.7-4.6-2.7.1-4 1-4.9 2z',
      tree: 'M12 22v-6M12 2 5 11h4l-5 5h16l-5-5h4z',
      harvest: 'M2 22 16 8M3.5 12.5 5 11l1.5 1.5a3.5 3.5 0 0 1 0 5L5 19l-1.5-1.5a3.5 3.5 0 0 1 0-5zM7.5 8.5 9 7l1.5 1.5a3.5 3.5 0 0 1 0 5L9 15l-1.5-1.5a3.5 3.5 0 0 1 0-5zM11.5 4.5 13 3l1.5 1.5a3.5 3.5 0 0 1 0 5L13 11l-1.5-1.5a3.5 3.5 0 0 1 0-5zM20 2h2v2a4 4 0 0 1-4 4h-2V6a4 4 0 0 1 4-4z',
      farmers: 'M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 3a4 4 0 1 1 0 8 4 4 0 0 1 0-8zM22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75',
      gms: 'M2 21v-2a4 4 0 0 1 4-4h5M9 3a4 4 0 1 1 0 8 4 4 0 0 1 0-8zM16 18l2 2 4-4',
      assoc: 'M3 21h18M5 21V7l7-4 7 4v14M9 21v-6h6v6M9 10h.01M15 10h.01',
      inbox: 'M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z',
      hub: 'M4 22h16a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2H8a2 2 0 0 0-2 2v16a2 2 0 0 1-2 2zm0 0a2 2 0 0 1-2-2v-9c0-1.1.9-2 2-2h2M18 14h-8M15 18h-5M10 6h8v4h-8z',
      beans: 'M12 3c-4.5 1.5-7 5.5-6 10s5 8 9 8M12 3c4.5 1 7.5 4.5 7 9.5S14.5 21 15 21M12 3c-1.5 3 1.5 5.5 0 9s1.5 6.5 3 9',
      orders: 'M9 2h6v4H9zM16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2M12 11h4M12 16h4M8 11h.01M8 16h.01',
      store: 'M3 9l1.5-5h15L21 9M3 9v11h18V9M3 9h18M9 20v-6h6v6',
      inventory: 'M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16zM3.3 7 12 12l8.7-5M12 22V12',
      map: 'M14.1 6.3 9.9 4.2a2 2 0 0 0-1.8 0L3.6 6.4A1 1 0 0 0 3 7.3v12.9a1 1 0 0 0 1.4.9l3.7-1.9a2 2 0 0 1 1.8 0l4.2 2.1a2 2 0 0 0 1.8 0l4.5-2.2a1 1 0 0 0 .6-.9V5.3a1 1 0 0 0-1.4-.9l-3.7 1.9a2 2 0 0 1-1.8 0zM9 4v15M15 6v15',
      reports: 'M3 3v18h18M7 16v-4M11 16V8M15 16v-6M19 16V5',
      audit: 'M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8M3 3v5h5M12 7v5l4 2',
      settings: 'M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6',
      reviews: 'M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z'
    };
    const role = this.props.role ?? 'farmer';
    const active = this.props.active ?? 'Overview';
    const it = (label, icon, href, extra) => ({ label, icon: I[icon], href, ...(extra || {}) });
    const S = {
      farmer: [
        ['Dashboard', [it('Overview', 'overview', 'OverviewFarmer.dc.html')]],
        ['Records', [it('Farm', 'farm', 'Farms.dc.html'), it('Tree', 'tree', 'Trees.dc.html'), it('Harvest', 'harvest', 'Harvests.dc.html')]],
        ['Community', [it('Inbox', 'inbox', 'Inbox.dc.html', { badge: 3 }), it('Hub', 'hub', 'Hub.dc.html')]],
        ['Marketplace', [it('Beans', 'beans', 'BeansFarmer.dc.html'), it('Orders', 'orders', 'OrdersFarmer.dc.html'), it('Store', 'store', 'Products.dc.html', { external: true })]],
        ['Map', [it('Farm Map', 'map', 'FarmMap.dc.html')]]
      ],
      group_manager: [
        ['Dashboard', [it('Overview', 'overview', 'OverviewGM.dc.html')]],
        ['Records', [it('Farmers', 'farmers', 'Farmers.dc.html', { badge: 4, alert: true }), it('Farm', 'farm', 'Farms.dc.html'), it('Tree', 'tree', 'Trees.dc.html'), it('Harvest', 'harvest', 'Harvests.dc.html')]],
        ['Community', [it('Inbox', 'inbox', 'Inbox.dc.html', { badge: 2 }), it('Hub', 'hub', 'Hub.dc.html')]],
        ['Marketplace', [it('Beans', 'beans', 'BeansFarmer.dc.html')]],
        ['Map', [it('Farm Map', 'map', 'FarmMap.dc.html')]],
        ['Insights', [it('Reports', 'reports', 'Reports.dc.html')]]
      ],
      kaluppa: [
        ['Dashboard', [it('Overview', 'overview', 'OverviewKaluppa.dc.html')]],
        ['Records', [it('Group Managers', 'gms', 'GroupManagers.dc.html'), it('Associations', 'assoc', 'Associations.dc.html'), it('Farm', 'farm', 'Farms.dc.html'), it('Tree', 'tree', 'Trees.dc.html'), it('Harvest', 'harvest', 'Harvests.dc.html')]],
        ['Community', [it('Inbox', 'inbox', 'Inbox.dc.html', { badge: 5 }), it('Hub', 'hub', 'Hub.dc.html')]],
        ['Marketplace', [it('Beans', 'beans', 'BeansKaluppa.dc.html', { badge: 6, alert: true }), it('Orders', 'orders', 'OrdersKaluppa.dc.html', { badge: 4, alert: true }), it('Inventory', 'inventory', 'Inventory.dc.html'), it('Reviews', 'reviews', 'Reviews.dc.html', { badge: 3 })]],
        ['Map', [it('Farm Map', 'map', 'FarmMap.dc.html')]],
        ['System', [it('Reports', 'reports', 'Reports.dc.html'), it('Audit log', 'audit', 'AuditLog.dc.html'), it('Settings', 'settings', 'SettingsKaluppa.dc.html')]]
      ]
    }[role];
    const fs = this.props.farmerStatus ?? 'approved';
    const org = {
      farmer: fs === 'approved' ? ['Your association', 'Santa Cruz Coffee Growers', 'Approved farmer', '#22633A'] : fs === 'pending' ? ['Requested association', 'Santa Cruz Coffee Growers', 'Waiting for approval', '#7A4A10'] : ['Association', 'Not in an association yet', 'Selling limit: 5 kg', '#7A4A10'],
      group_manager: ['Group Manager of', 'Santa Cruz Coffee Growers', '18 farmers · 4 waiting', '#7A4A10'],
      kaluppa: null
    }[role];
    return {
      homeHref: S[0][1][0].href,
      roleLabel: { farmer: 'Farmer', group_manager: 'Group Manager', kaluppa: 'Kaluppa' }[role],
      sections: S.map(([label, items]) => ({ label, items: items.map((x) => { const on = x.label === active; return { ...x, current: on ? 'page' : undefined, bg: on ? '#7B4A2A' : 'transparent', fg: on ? '#FFFFFF' : '#4A3A30', fw: on ? 600 : 500, hasBadge: !!x.badge, badgeBg: on ? '#FFFFFF' : (x.alert ? '#7B4A2A' : '#F3E3C7'), badgeFg: on ? '#7B4A2A' : (x.alert ? '#FFFFFF' : '#5C3D0E'), external: !!x.external }; }) })),
      hasOrg: !!org,
      orgCaption: org ? org[0] : '', orgName: org ? org[1] : '', orgStatus: org ? org[2] : '', orgStatusFg: org ? org[3] : '#4A3A30'
    };
  }
}
</script>
</body>
</html>
